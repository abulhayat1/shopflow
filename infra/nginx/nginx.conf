# ================================================================
# ShopFlow - Nginx Reverse Proxy Configuration
#
# ARCHITECT NOTE: Nginx sits in FRONT of all services.
# External clients never talk to services directly.
# This is the classic "reverse proxy" pattern.
#
# Why use Nginx instead of just exposing the gateway directly?
#  - SSL termination: Nginx handles HTTPS, services use plain HTTP
#  - Static file serving: much faster than Node.js
#  - Connection management: keep-alive, buffering, compression
#  - A second layer of DoS protection
#
# Traffic flow:
#   Browser / curl
#     ↓  (port 80 / 443)
#   Nginx (reverse proxy)
#     ↓  (port 3000, internal)
#   API Gateway (Node.js)
#     ↓  (ports 3001-3004, internal)
#   Microservices
# ================================================================

events {
    worker_connections 1024;
}

http {
    # ── Logging ────────────────────────────────────────────────
    # Combined log format with upstream response time — useful for
    # diagnosing slow services before we have Prometheus in Phase 4
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream_time=$upstream_response_time';

    # access_log /var/log/nginx/shopflow_access.log main;
    # error_log  /var/log/nginx/shopflow_error.log warn;

    # ── Security Headers ───────────────────────────────────────
    # Basic hardening — Phase 4 will add more via OPA policies
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # ── Upstream → API Gateway ─────────────────────────────────
    # ARCHITECT NOTE: "upstream" is Nginx's way of defining a backend.
    # Right now we have 1 instance. In Phase 2+, we'll list multiple
    # pod IPs here (or use K8s Service DNS instead of Nginx entirely).
    upstream shopflow_gateway {
        server 127.0.0.1:3000;

        # keepalive: reuse TCP connections to the gateway
        # without this, each request pays TCP handshake overhead
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost shopflow.local;

        # ── Health Check (Nginx level) ────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","component":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── API — proxy to gateway ────────────────────────────
        location / {
            proxy_pass         http://shopflow_gateway;
            proxy_http_version 1.1;

            # Required for keepalive upstream connections
            proxy_set_header   Connection "";

            # Forward real client IP to gateway/services
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts — tune based on your slowest endpoint
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer settings — prevent slow clients from tying up upstream
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }
    }
}
