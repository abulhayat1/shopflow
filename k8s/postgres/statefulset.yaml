# =============================================================================
# LESSON: StatefulSet vs Deployment — why PostgreSQL is different
# =============================================================================
# Most services in Kubernetes use a Deployment. But databases are special.
#
# Deployment:
#   - Pods are interchangeable (any pod can serve any request)
#   - Pods can be created/deleted in ANY order
#   - No stable hostname per pod — pod names are random
#   - No persistent storage guarantee per pod
#
# StatefulSet:
#   - Each pod gets a STABLE NAME: postgres-0, postgres-1, postgres-2
#   - Pods are created/deleted in ORDER (0 → 1 → 2)
#   - Each pod gets its OWN PersistentVolumeClaim (own disk)
#   - The same pod always gets the same storage, even after rescheduling
#
# PostgreSQL NEEDS:
#   ✅ Stable hostname (postgres-0 is always the primary)
#   ✅ Stable storage (pod-0 always mounts the same disk)
#   ✅ Ordered startup (primary before replicas)
#
# In production, you'd use the CloudNativePG operator or Amazon RDS instead
# of managing your own PostgreSQL in K8s. We do this here to learn the concept.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shopflow
data:
  # We need to adjust init.sql for K8s: the DB is created via env vars
  # so we only need the TABLE creation parts here.
  # The 3 databases are created by our services' init jobs.
  init.sql: |
    -- Connect to users DB (created automatically from env)
    \connect shopflow_users

    CREATE TABLE IF NOT EXISTS users (
      id            SERIAL PRIMARY KEY,
      name          VARCHAR(255) NOT NULL,
      email         VARCHAR(255) UNIQUE NOT NULL,
      password_hash TEXT NOT NULL,
      created_at    TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at    TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO shopflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO shopflow;

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopflow
  labels:
    app: postgres
spec:
  serviceName: postgres           # must match the Headless Service name below
  replicas: 1                     # single primary for learning; production = CloudNativePG
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            # These env vars tell the postgres container to create
            # the user and initial DB on first boot
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: shopflow_users     # postgres creates this DB on first boot

          # ─── Volume Mounts ─────────────────────────────────────────────────
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data     # postgres data directory
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d  # auto-run on first boot

          # ─── Probes ────────────────────────────────────────────────────────
          # LESSON: livenessProbe vs readinessProbe
          # livenessProbe:  "Is this pod alive?"
          #   → if it fails, K8s RESTARTS the container
          #   → use for: detecting deadlocks, infinite loops, crashes
          #
          # readinessProbe: "Is this pod ready to receive traffic?"
          #   → if it fails, K8s removes it from Service's load balancer
          #   → pod is NOT restarted, just taken out of rotation
          #   → use for: DB still initializing, cache warming up, etc.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "shopflow", "-d", "shopflow_users"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shopflow", "-d", "shopflow_users"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5

          # ─── Resource Limits ───────────────────────────────────────────────
          # LESSON: Requests vs Limits
          # requests: "I need at LEAST this much" — used for scheduling
          #   K8s finds a node with enough free CPU/RAM to satisfy the request
          # limits:   "I must NEVER use more than this"
          #   If a container exceeds its memory limit → OOMKilled (restarted)
          #   If it exceeds CPU limit → throttled (not killed)
          #
          # Without limits: one misbehaving pod can starve all others on the node
          resources:
            requests:
              cpu: "100m"       # 100 millicores = 0.1 CPU core
              memory: "128Mi"   # 128 MiB RAM
            limits:
              cpu: "500m"       # 0.5 CPU core max
              memory: "512Mi"   # 512 MiB max

      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init    # mount our ConfigMap as files

  # ─── PersistentVolumeClaim Template ────────────────────────────────────────
  # LESSON: volumeClaimTemplates in StatefulSets
  # Unlike Deployments, StatefulSets create a PVC PER POD.
  # If you have 3 replicas, you get 3 separate PVCs (3 separate disks).
  # This is how Postgres primary/replica storage isolation works.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]  # only 1 pod can mount this at a time
        resources:
          requests:
            storage: 2Gi              # 2GB disk for our dev database

---
# =============================================================================
# LESSON: Headless Service for StatefulSets
# =============================================================================
# Normal Services give you a SINGLE virtual IP that load balances to all pods.
# For a StatefulSet, each pod needs a STABLE hostname.
# A Headless Service (clusterIP: None) registers DNS entries per pod:
#   postgres-0.postgres.shopflow.svc.cluster.local
#   postgres-1.postgres.shopflow.svc.cluster.local
# This is how postgres clients always find the PRIMARY (postgres-0).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopflow
spec:
  clusterIP: None          # ← makes this "headless"
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
