apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shopflow
data:
  init.sql: |
    -- Connect to users DB (created automatically from env)
    \connect shopflow_users

    CREATE TABLE IF NOT EXISTS users (
      id            SERIAL PRIMARY KEY,
      name          VARCHAR(255) NOT NULL,
      email         VARCHAR(255) UNIQUE NOT NULL,
      password_hash TEXT NOT NULL,
      created_at    TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at    TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO shopflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO shopflow;

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopflow
  labels:
    app: postgres
spec:
  serviceName: postgres           # must match the Headless Service name below
  replicas: 1                     # single primary for learning; production = CloudNativePG
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: shopflow_users     # postgres creates this DB on first boot

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data     # postgres data directory
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d  # auto-run on first boot

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "shopflow", "-d", "shopflow_users"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shopflow", "-d", "shopflow_users"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"       # 100 millicores = 0.1 CPU core
              memory: "128Mi"   # 128 MiB RAM
            limits:
              cpu: "500m"       # 0.5 CPU core max
              memory: "512Mi"   # 512 MiB max

      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init    # mount our ConfigMap as files

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]  # only 1 pod can mount this at a time
        resources:
          requests:
            storage: 2Gi              # 2GB disk for our dev database

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopflow
spec:
  clusterIP: None          # ← makes this "headless"
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
