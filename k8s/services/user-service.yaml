apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopflow
  labels:
    app: user-service
    version: "1.0.0"
spec:
  replicas: 2    # LESSON: 2 replicas = high availability. If pod-1 crashes,

  selector:
    matchLabels:
      app: user-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: user-service       # ← must match selector.matchLabels above
        version: "1.0.0"
    spec:
      containers:
        - name: user-service
          image: shopflow/user-service:local
          imagePullPolicy: Never    # use local image (no registry yet) — change to Always in prod

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: shopflow-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: shopflow-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: shopflow-config
                  key: USERS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: JWT_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopflow
spec:
  type: ClusterIP      # internal only — NOT reachable from outside the cluster
  selector:
    app: user-service  # routes traffic to pods matching this label
  ports:
    - port: 3001        # port clients use to reach the Service
      targetPort: 3001  # port on the actual Pod
      protocol: TCP
