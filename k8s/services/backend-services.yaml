# product-service, order-service, notification-service K8s manifests
# Shorter comments — read user-service.yaml for the full lesson.
# Key concepts: same Deployment pattern, different env vars per service.

# ─── product-service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: shopflow/product-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: PRODUCTS_DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: DB_PASSWORD }
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002

