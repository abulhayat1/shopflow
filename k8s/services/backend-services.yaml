# ─── order-service ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: shopflow/order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: ORDERS_DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: DB_PASSWORD }
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: PRODUCT_SERVICE_URL }
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: shopflow-config, key: NOTIFICATION_SERVICE_URL }
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopflow
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 3003
      targetPort: 3003

---
# ─── notification-service ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopflow
spec:
  replicas: 1    # notifications are fire-and-forget; 1 replica is fine
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: shopflow/notification-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopflow
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
