# =============================================================================
# LESSON: Kubernetes Secrets
# =============================================================================
# Secrets store sensitive values (passwords, tokens, API keys).
# They are base64 encoded — NOT encrypted by default!
#
# Wait, base64 is not encryption — isn't this insecure?
# In a basic cluster, yes. This is why in Phase 4 we use HashiCorp Vault
# which actually encrypts secrets at rest and controls who can read them.
#
# For now, K8s Secrets are better than plaintext in ConfigMaps because:
#   - They're stored in etcd (K8s state store) separately from ConfigMaps
#   - RBAC can grant read access to specific pods only
#   - They don't show in `kubectl describe pod` output (ConfigMap values do)
#   - They're a signal to tools: "this needs special handling"
#
# Generate base64 values:
#   echo -n "shopflow123" | base64
#   c2hvcGZsb3cxMjM=
#
# ⚠️  NEVER commit real Secrets to git!
# In production we use: AWS Secrets Manager + External Secrets Operator
# to sync secrets from AWS into K8s automatically (we cover this in Phase 4).
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shopflow-secrets
  namespace: shopflow
type: Opaque
data:
  # echo -n "shopflow123" | base64
  DB_PASSWORD: c2hvcGZsb3cxMjM=

  # echo -n "shopflow" | base64
  DB_USER: c2hvcGZsb3c=

  # echo -n "shopflow-k8s-secret-change-in-prod" | base64
  JWT_SECRET: c2hvcGZsb3ctazhzLXNlY3JldC1jaGFuZ2UtaW4tcHJvZA==

  # PostgreSQL superuser password
  # echo -n "shopflow123" | base64
  POSTGRES_PASSWORD: c2hvcGZsb3cxMjM=
